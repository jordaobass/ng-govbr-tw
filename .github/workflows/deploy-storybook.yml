name: Publica o Storybook no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # O Storybook consome o PACOTE compilado, não o código-fonte: é o mesmo
      # artefato que o consumidor instala.
      - name: Build da biblioteca
        run: npm run build

      # O Storybook é a documentação oficial (D19) e vai na RAIZ do Pages. Ele
      # usa caminhos relativos, então funciona em subcaminho sem base-href.
      - name: Build do Storybook
        run: npx ng run ng-govbr-tw:build-storybook

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/storybook

      - id: deployment
        uses: actions/deploy-pages@v4
