<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>ng-govbr-tw — componentes Angular do Design System Gov.br</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!--
    Fonte e ícones ficam AQUI, não dentro do CSS da biblioteca.

    O `govbr-tw.css` trazia estes dois endereços como `@import url(...)`, o que
    obrigava todo consumidor a buscar CDN externo — e falhava em silêncio em
    intranet sem internet ou com CSP restritiva. É exatamente isto que o
    schematic `ng-add` injeta no index.html de quem instala a lib.
  -->
  <link rel="stylesheet"
        href="https://cdngovbr-ds.estaleiro.serpro.gov.br/design-system/fonts/rawline/css/rawline.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <app-root></app-root>
</body>
</html>
